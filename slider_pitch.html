<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Slider Pitch</title>
  </head>
  <body>
    <input id="freq" type="range" min="1" max="10" value="1" step="1" /><label
      id="freqDisplay"
      >1</label
    >
    <input id="freq2" type="range" min="1" max="10" value="1" step="1" /><label
      id="freqDisplay2"
      >1</label
    >
    <input id="freq3" type="range" min="1" max="10" value="1" step="1" /><label
      id="freqDisplay3"
      >1</label
    >

    <input
      id="gain"
      type="range"
      min="0"
      max="1"
      value="0.1"
      step="0.01"
    /><label id="gainDisplay">0.1</label>
    <input
      id="gain2"
      type="range"
      min="0"
      max="1"
      value="0.1"
      step="0.01"
    /><label id="gainDisplay2">0.1</label>

    <input
      id="gain3"
      type="range"
      min="0"
      max="1"
      value="0.1"
      step="0.01"
    /><label id="gainDisplay3">0.1</label>

    <script>
      const ctx = new AudioContext();
      ctx.suspend();
      let freq = 110;

      const osc1 = new OscillatorNode(ctx);
      osc1.type = "triangle";
      osc1.frequency.value = freq;

      const osc2 = new OscillatorNode(ctx);
      osc2.type = "triangle";
      osc2.frequency.value = freq * 0.99;

      const osc3 = new OscillatorNode(ctx);
      osc3.type = "triangle";
      osc3.frequency.value = freq * 0.7;

      const gain1 = new GainNode(ctx);
      gain1.gain.value = 0.1;

      osc1.connect(gain1);
      osc2.connect(gain1);
      osc3.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start();
      osc2.start();
      osc3.start();

      // Second set of oscillators

      let freq2 = 220;

      const osc4 = new OscillatorNode(ctx);
      osc4.type = "sine";
      osc4.frequency.value = freq2;

      const osc5 = new OscillatorNode(ctx);
      osc5.type = "sine";
      osc5.frequency.value = freq2 * 0.89;

      const osc6 = new OscillatorNode(ctx);
      osc6.type = "sine";
      osc6.frequency.value = freq2 * 1.4;

      const gain2 = new GainNode(ctx);
      gain2.gain.value = 0.1;

      osc4.connect(gain2);
      osc5.connect(gain2);
      osc6.connect(gain2);
      gain2.connect(ctx.destination);
      osc4.start();
      osc5.start();
      osc6.start();

      // third set

      let freq3 = 440;

      const osc7 = new OscillatorNode(ctx);
      osc7.type = "sine";
      osc7.frequency.value = freq3;

      const osc8 = new OscillatorNode(ctx);
      osc8.type = "sine";
      osc8.frequency.value = freq3 * 0.89;

      const osc9 = new OscillatorNode(ctx);
      osc9.type = "sine";
      osc9.frequency.value = freq3 * 1.4;

      const gain3 = new GainNode(ctx);
      gain3.gain.value = 0.1;

      osc7.connect(gain3);
      osc8.connect(gain3);
      osc9.connect(gain3);
      gain3.connect(ctx.destination);
      osc7.start();
      osc8.start();
      osc9.start();

      const slider1 = document.querySelector("#freq");
      slider1.addEventListener("input", () => {
        ctx.resume();
        osc1.frequency.value = freq * Number(slider1.value);
        osc2.frequency.value = freq * Number(slider1.value) * 2;
        osc3.frequency.value = freq * Number(slider1.value) * 3;
        document.querySelector("#freqDisplay").textContent = slider1.value;
      });

      const slider2 = document.querySelector("#freq2");
      slider2.addEventListener("input", () => {
        ctx.resume();
        osc4.frequency.value = freq2 * Number(slider2.value);
        osc5.frequency.value = freq2 * Number(slider2.value) * 3;
        osc6.frequency.value = freq2 * Number(slider2.value) * 7;
        document.querySelector("#freqDisplay2").textContent = slider2.value;
      });

      const slider3 = document.querySelector("#freq3");
      slider3.addEventListener("input", () => {
        ctx.resume();
        osc7.frequency.value = freq3 * Number(slider3.value);
        osc8.frequency.value = freq3 * Number(slider3.value) * 3;
        osc9.frequency.value = freq3 * Number(slider3.value) * 7;
        document.querySelector("#freqDisplay3").textContent = slider3.value;
      });

      const gainSlider1 = document.querySelector("#gain");
      gainSlider1.addEventListener("input", () => {
        ctx.resume();
        gain1.gain.value = Number(gainSlider1.value);
        document.querySelector("#gainDisplay1").textContent = gainSlider1.value;
      });

      const gainSlider2 = document.querySelector("#gain2");
      gainSlider2.addEventListener("input", () => {
        ctx.resume();
        gain2.gain.value = Number(gainSlider2.value);
        document.querySelector("#gainDisplay2").textContent = gainSlider2.value;
      });

      const gainSlider3 = document.querySelector("#gain3");
      gainSlider3.addEventListener("input", () => {
        ctx.resume();
        gain3.gain.value = Number(gainSlider3.value);
        document.querySelector("#gainDisplay3").textContent = gainSlider3.value;
      });
    </script>
  </body>
</html>
