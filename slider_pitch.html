<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Slider Pitch</title>
  </head>
  <body>
    <input id="freq" type="range" min="1" max="10" value="1" step="1" /><label
      id="freqDisplay"
      >1</label
    >

    <input
      id="gain"
      type="range"
      min="0"
      max="1"
      value="0.1"
      step="0.01"
    /><label id="gainDisplay">0.1</label>

    <script>
      const ctx = new AudioContext();
      ctx.suspend();
      let freq = 110;

      const osc = new OscillatorNode(ctx);
      osc.type = "triangle";

      const osc2 = new OscillatorNode(ctx);
      osc2.type = "triangle";

      const osc3 = new OscillatorNode(ctx);
      osc3.type = "triangle";

      const gain = new GainNode(ctx);
      gain.gain.value = 0.1;

      osc.connect(gain);
      osc2.connect(gain);
      osc3.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc2.start();
      osc3.start();

      const slider = document.querySelector("#freq");
      slider.addEventListener("input", () => {
        ctx.resume();
        osc.frequency.value = freq * Number(slider.value);
        osc2.frequency.value = freq * Number(slider.value) * 0.3;
        osc3.frequency.value = freq * Number(slider.value) * 0.7;
        document.querySelector("#freqDisplay").textContent = slider.value;
      });

      const gainSlider = document.querySelector("#gain");
      gainSlider.addEventListener("input", () => {
        ctx.resume();
        gain.gain.value = Number(gainSlider.value);
        document.querySelector("#gainDisplay").textContent = gainSlider.value;
      });
    </script>
  </body>
</html>
